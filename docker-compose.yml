services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    environment:
      - NODE_ENV=development
    user: "1000:1000"
    networks:
      - bus_network
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:Z
      - /app/.venv
      - ./docs:/app/docs:Z
      - ./data.json:/app/data.json:Z
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - UV_CACHE_DIR=/tmp/uv-cache
    networks:
      - bus_network
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=scheduling
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bus_network

networks:
  bus_network:
    driver: bridge

volumes:
  postgres_data: