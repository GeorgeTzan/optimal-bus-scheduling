[project]
name = "optimal-scheduling-system"
version = "0.1.0"
description = "Optimal bus scheduling system for KTEL companies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.6",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "ortools>=9.15.6755",
    "openpyxl==3.1.5",
    "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "python-calamine>=0.8.3,<0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
